<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>音ゲーエディタ & インゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        /* ヘッダー・モード切り替え */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background-color: #2a2a2a;
            border-bottom: 1px solid #444;
            height: 50px;
        }
        .mode-selector button {
            padding: 6px 12px;
            margin-right: 8px;
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .mode-selector button.active {
            background-color: #007acc;
            font-weight: bold;
        }

        /* エディタ領域 */
        #editor-view {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            overflow: hidden;
        }
        #grid-container {
            position: relative;
            display: grid;
            gap: 2px;
            background-color: #333;
            padding: 2px;
            border-radius: 4px;
        }
        .grid-cell {
            background-color: #222;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }
        .grid-cell.has-note {
            background-color: #005999;
        }
        .grid-cell.selected {
            outline: 2px solid #ffcc00;
            z-index: 2;
        }
        .grid-cell.has-judge-line {
            background-color: #008040;
        }

        /* ③ 範囲選択中のノーツ：紫色に点滅 */
        @keyframes purple-blink {
            0% { background-color: #8a2be2; opacity: 1; }
            50% { background-color: #da70d6; opacity: 0.5; }
            100% { background-color: #8a2be2; opacity: 1; }
        }
        .grid-cell.selecting-blink {
            animation: purple-blink 0.4s infinite;
            z-index: 3;
        }

        /* 範囲選択用オーバーレイ矩形 */
        #selection-box {
            position: absolute;
            border: 1px dashed #da70d6;
            background-color: rgba(138, 43, 226, 0.2);
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        /* サブメニュー・設定パネル */
        .settings-panel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(30, 30, 30, 0.95);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 12px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 20;
            min-width: 280px;
        }
        .settings-panel.active {
            display: block;
        }
        .settings-panel h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #00aaff;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .panel-row input, .panel-row select {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px;
            border-radius: 4px;
        }
        .panel-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }
        .panel-buttons button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background-color: #007acc;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
        }
        .panel-buttons button.close-btn {
            background-color: #666;
        }

        /* インゲーム表示用キャンバス（簡易） */
        #ingame-view {
            flex: 1;
            display: none;
            background-color: #000;
            position: relative;
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <div class="mode-selector">
            <button id="btn-mode-notes" class="active">ノーツ設定</button>
            <button id="btn-mode-judge">判定ライン設定</button>
            <button id="btn-mode-play">インゲーム再生</button>
        </div>
        <div id="status-display" style="font-size: 12px; color: #aaa;">モード: ノーツ設定</div>
    </header>

    <div id="editor-view">
        <div id="grid-container"></div>
        <div id="selection-box"></div>

        <!-- ノーツ設定メニュー -->
        <div id="notes-settings-panel" class="settings-panel">
            <h3>ノーツ設定メニュー</h3>
            <div class="panel-row">
                <label for="note-trajectory">軌道パターン:</label>
                <select id="note-trajectory">
                    <option value="straight">直線</option>
                    <option value="curve-left">左カーブ</option>
                    <option value="curve-right">右カーブ</option>
                </select>
            </div>
            <div class="panel-row">
                <label for="note-size">サイズ:</label>
                <input type="number" id="note-size" value="1.0" step="0.1" min="0.5" max="3.0">
            </div>
            <div class="panel-buttons">
                <button id="btn-delete-notes" style="background-color: #cc2222;">削除</button>
                <button class="close-btn" id="btn-close-notes-panel">閉じる</button>
            </div>
        </div>

        <!-- 判定ライン設定メニュー -->
        <div id="judge-settings-panel" class="settings-panel">
            <h3>判定ライン設定メニュー</h3>
            <div class="panel-row">
                <label for="judge-type">タイプ:</label>
                <select id="judge-type">
                    <option value="normal">通常</option>
                    <option value="wide">ワイド</option>
                </select>
            </div>
            <div class="panel-buttons">
                <button class="close-btn" id="btn-close-judge-panel">閉じる</button>
            </div>
        </div>
    </div>

    <div id="ingame-view">
        <div style="color: white; padding: 20px;">インゲーム画面（ダミー）</div>
    </div>
</div>

<script>
    // --- 定数・ステート定義 ---
    const GRID_ROWS = 12;
    const GRID_COLS = 8;
    const CELL_SIZE = 40; // 1グリッドあたりのピクセルサイズ目安

    // エディタモード: 'notes' | 'judge' | 'play'
    let currentMode = 'notes';

    // 盤面データ (x, y キーで格納)
    // ノーツ: { id, x, y, trajectory, size }
    // 判定ライン: { id, x, y, type }
    const notesData = new Map();
    const judgeLinesData = new Map();

    // 選択状態
    let selectedNoteKeys = new Set();
    let selectedJudgeKeys = new Set();

    // タッチ / ドラッグ操作追跡用
    let isInteracting = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;
    let startCellX = -1;
    let startCellY = -1;

    let longPressTimer = null;
    let isRangeSelecting = false;
    let hasTriggeredLongPress = false;

    // DOM参照
    const gridContainer = document.getElementById('grid-container');
    const selectionBox = document.getElementById('selection-box');
    const notesPanel = document.getElementById('notes-settings-panel');
    const judgePanel = document.getElementById('judge-settings-panel');
    const statusDisplay = document.getElementById('status-display');

    // --- グリッド初期化 ---
    function initGrid() {
        gridContainer.style.gridTemplateColumns = `repeat(${GRID_COLS}, ${CELL_SIZE}px)`;
        gridContainer.style.gridTemplateRows = `repeat(${GRID_ROWS}, ${CELL_SIZE}px)`;
        gridContainer.innerHTML = '';

        for (let y = 0; y < GRID_ROWS; y++) {
            for (let x = 0; x < GRID_COLS; x++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.x = x;
                cell.dataset.y = y;
                cell.style.width = `${CELL_SIZE}px`;
                cell.style.height = `${CELL_SIZE}px`;
                gridContainer.appendChild(cell);
            }
        }
    }

    function getKey(x, y) { return `${x},${y}`; }

    // 再描画処理
    function renderGrid() {
        const cells = gridContainer.children;
        for (let cell of cells) {
            const x = parseInt(cell.dataset.x);
            const y = parseInt(cell.dataset.y);
            const key = getKey(x, y);

            // クラスのリセット
            cell.className = 'grid-cell';

            // ノーツ表示
            if (notesData.has(key)) {
                cell.classList.add('has-note');
            }

            // 判定ライン表示
            if (judgeLinesData.has(key)) {
                cell.classList.add('has-judge-line');
            }

            // ③ 範囲選択中の動的な点滅スタイル適用
            if (isRangeSelecting && isCellInSelectionBox(x, y)) {
                if (currentMode === 'notes' && notesData.has(key)) {
                    cell.classList.add('selecting-blink');
                }
            }

            // 確定選択状態
            if (currentMode === 'notes' && selectedNoteKeys.has(key)) {
                cell.classList.add('selected');
            } else if (currentMode === 'judge' && selectedJudgeKeys.has(key)) {
                cell.classList.add('selected');
            }
        }
    }

    // --- 操作ロジック ---

    function getCellCoordsFromPoint(px, py) {
        const rect = gridContainer.getBoundingClientRect();
        const relX = px - rect.left;
        const relY = py - rect.top;

        if (relX < 0 || relX >= rect.width || relY < 0 || relY >= rect.height) {
            return null;
        }

        const x = Math.floor(relX / (CELL_SIZE + 2)); // gap 2pxを考慮
        const y = Math.floor(relY / (CELL_SIZE + 2));
        return {
            x: Math.min(Math.max(x, 0), GRID_COLS - 1),
            y: Math.min(Math.max(y, 0), GRID_ROWS - 1)
        };
    }

    function handleStart(px, py) {
        isInteracting = true;
        startX = px;
        startY = py;
        currentX = px;
        currentY = py;

        const coords = getCellCoordsFromPoint(px, py);
        if (!coords) return;

        startCellX = coords.x;
        startCellY = coords.y;
        const key = getKey(startCellX, startCellY);

        hasTriggeredLongPress = false;
        isRangeSelecting = false;

        // タイマーセット: 0.5秒間保持
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
            if (!isInteracting) return;

            // ①・② 0.5秒経過し、かつ範囲選択に移行していなければ「長押し」として判定
            if (!isRangeSelecting) {
                hasTriggeredLongPress = true;
                executeLongPressAction(startCellX, startCellY);
            }
        }, 500);
    }

    function handleMove(px, py) {
        if (!isInteracting) return;
        currentX = px;
        currentY = py;

        const deltaX = Math.abs(currentX - startX);
        const deltaY = Math.abs(currentY - startY);

        // ②「グリッドの辺2つ分」の距離を移動閾値とする (2 × CELL_SIZE)
        const moveThreshold = CELL_SIZE * 2;

        if (!isRangeSelecting && (deltaX > moveThreshold || deltaY > moveThreshold)) {
            // 閾値を超えて動いた場合は範囲選択を開始
            isRangeSelecting = true;
            clearTimeout(longPressTimer); // 単体長押し判定をキャンセル
        }

        if (isRangeSelecting) {
            updateSelectionBox();
            renderGrid(); // ③ 範囲選択中のノーツ点滅（.selecting-blink）を更新
        }
    }

    function handleEnd() {
        if (!isInteracting) return;
        clearTimeout(longPressTimer);

        if (isRangeSelecting) {
            // 範囲選択の確定処理
            finalizeRangeSelection();
        } else if (!hasTriggeredLongPress) {
            // 短いタップ時の処理
            executeTapAction(startCellX, startCellY);
        }

        // リセット
        isInteracting = false;
        isRangeSelecting = false;
        selectionBox.style.display = 'none';
        renderGrid();
    }

    // ① 単体長押しアクション
    function executeLongPressAction(cx, cy) {
        if (cx < 0 || cy < 0) return;
        const key = getKey(cx, cy);

        if (currentMode === 'notes') {
            if (notesData.has(key)) {
                // 中身のあるグリッドの場合、単体選択を行って即座にノーツ設定メニューを開く
                selectedNoteKeys.clear();
                selectedNoteKeys.add(key);
                openNotesPanel();
            }
        } else if (currentMode === 'judge') {
            if (judgeLinesData.has(key)) {
                selectedJudgeKeys.clear();
                selectedJudgeKeys.add(key);
                openJudgePanel();
            }
        }
        renderGrid();
    }

    // タップ時アクション（ノーツの追加・削除）
    function executeTapAction(cx, cy) {
        if (cx < 0 || cy < 0) return;
        const key = getKey(cx, cy);

        if (currentMode === 'notes') {
            if (notesData.has(key)) {
                // 既存ノーツの削除
                notesData.delete(key);
                selectedNoteKeys.delete(key);
                closeAllPanels();
            } else {
                // ④ 空白グリッドに打込み：打ち込まれたノーツは選択状態にしない
                notesData.set(key, { id: Date.now(), x: cx, y: cy, trajectory: 'straight', size: 1.0 });
                selectedNoteKeys.clear(); // 選択状態を解除
                closeAllPanels();
            }
        } else if (currentMode === 'judge') {
            if (judgeLinesData.has(key)) {
                judgeLinesData.delete(key);
                selectedJudgeKeys.delete(key);
                closeAllPanels();
            } else {
                judgeLinesData.set(key, { id: Date.now(), x: cx, y: cy, type: 'normal' });
                selectedJudgeKeys.clear();
                closeAllPanels();
            }
        }
        renderGrid();
    }

    // 範囲選択の描画更新
    function updateSelectionBox() {
        const rect = gridContainer.getBoundingClientRect();
        const left = Math.min(startX, currentX) - rect.left;
        const top = Math.min(startY, currentY) - rect.top;
        const width = Math.abs(currentX - startX);
        const height = Math.abs(currentY - startY);

        selectionBox.style.left = `${left}px`;
        selectionBox.style.top = `${top}px`;
        selectionBox.style.width = `${width}px`;
        selectionBox.style.height = `${height}px`;
        selectionBox.style.display = 'block';
    }

    function isCellInSelectionBox(x, y) {
        const startCoords = getCellCoordsFromPoint(startX, startY);
        const currentCoords = getCellCoordsFromPoint(currentX, currentY);
        if (!startCoords || !currentCoords) return false;

        const minX = Math.min(startCoords.x, currentCoords.x);
        const maxX = Math.max(startCoords.x, currentCoords.x);
        const minY = Math.min(startCoords.y, currentCoords.y);
        const maxY = Math.max(startCoords.y, currentCoords.y);

        return x >= minX && x <= maxX && y >= minY && y <= maxY;
    }

    // 範囲選択確定
    function finalizeRangeSelection() {
        const startCoords = getCellCoordsFromPoint(startX, startY);
        const currentCoords = getCellCoordsFromPoint(currentX, currentY);
        if (!startCoords || !currentCoords) return;

        const minX = Math.min(startCoords.x, currentCoords.x);
        const maxX = Math.max(startCoords.x, currentCoords.x);
        const minY = Math.min(startCoords.y, currentCoords.y);
        const maxY = Math.max(startCoords.y, currentCoords.y);

        if (currentMode === 'notes') {
            selectedNoteKeys.clear();
            for (let y = minY; y <= maxY; y++) {
                for (let x = minX; x <= maxX; x++) {
                    const key = getKey(x, y);
                    if (notesData.has(key)) {
                        selectedNoteKeys.add(key);
                    }
                }
            }
            if (selectedNoteKeys.size > 0) {
                openNotesPanel();
            } else {
                closeAllPanels();
            }
        } else if (currentMode === 'judge') {
            selectedJudgeKeys.clear();
            for (let y = minY; y <= maxY; y++) {
                for (let x = minX; x <= maxX; x++) {
                    const key = getKey(x, y);
                    if (judgeLinesData.has(key)) {
                        selectedJudgeKeys.add(key);
                    }
                }
            }
            if (selectedJudgeKeys.size > 0) {
                openJudgePanel();
            } else {
                closeAllPanels();
            }
        }
    }

    // --- パネル制御 ---
    function openNotesPanel() {
        closeAllPanels();
        notesPanel.classList.add('active');
    }

    function openJudgePanel() {
        closeAllPanels();
        judgePanel.classList.add('active');
    }

    function closeAllPanels() {
        notesPanel.classList.remove('active');
        judgePanel.classList.remove('active');
    }

    // --- イベントリスナーの準備 ---
    function setupEvents() {
        // モード切替
        document.getElementById('btn-mode-notes').addEventListener('click', () => setMode('notes'));
        document.getElementById('btn-mode-judge').addEventListener('click', () => setMode('judge'));
        document.getElementById('btn-mode-play').addEventListener('click', () => setMode('play'));

        // タッチ / マウスイベント結合
        const container = gridContainer;

        container.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleStart(touch.clientX, touch.clientY);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isInteracting) return;
            const touch = e.touches[0];
            handleMove(touch.clientX, touch.clientY);
        }, { passive: true });

        window.addEventListener('touchend', () => handleEnd());

        container.addEventListener('mousedown', (e) => {
            handleStart(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', () => handleEnd());

        // パネル内ボタン制御
        document.getElementById('btn-close-notes-panel').addEventListener('click', () => {
            closeAllPanels();
            selectedNoteKeys.clear();
            renderGrid();
        });

        document.getElementById('btn-close-judge-panel').addEventListener('click', () => {
            closeAllPanels();
            selectedJudgeKeys.clear();
            renderGrid();
        });

        document.getElementById('btn-delete-notes').addEventListener('click', () => {
            selectedNoteKeys.forEach(key => {
                notesData.delete(key);
            });
            selectedNoteKeys.clear();
            closeAllPanels();
            renderGrid();
        });
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-selector button').forEach(b => b.classList.remove('active'));
        closeAllPanels();
        selectedNoteKeys.clear();
        selectedJudgeKeys.clear();

        const editorView = document.getElementById('editor-view');
        const ingameView = document.getElementById('ingame-view');

        if (mode === 'notes') {
            document.getElementById('btn-mode-notes').classList.add('active');
            statusDisplay.textContent = 'モード: ノーツ設定';
            editorView.style.display = 'flex';
            ingameView.style.display = 'none';
        } else if (mode === 'judge') {
            document.getElementById('btn-mode-judge').classList.add('active');
            statusDisplay.textContent = 'モード: 判定ライン設定';
            editorView.style.display = 'flex';
            ingameView.style.display = 'none';
        } else if (mode === 'play') {
            document.getElementById('btn-mode-play').classList.add('active');
            statusDisplay.textContent = 'モード: インゲーム再生';
            editorView.style.display = 'none';
            ingameView.style.display = 'block';
        }
        renderGrid();
    }

    // 初期化実行
    window.addEventListener('DOMContentLoaded', () => {
        initGrid();
        setupEvents();
        renderGrid();
    });
</script>
</body>
</html>
